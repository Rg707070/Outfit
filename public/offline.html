<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Outfit — אופליין</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: #f9fafb; color: #111827; padding: 24px; text-align: center;
    }
    .card { max-width: 360px; }
    .glyph { font-size: 56px; line-height: 1; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6b7280; font-size: 14px; margin: 0 0 20px; line-height: 1.6; }
    button {
      background: #111827; color: #fff; border: 0; border-radius: 12px;
      padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1f2937; }
  </style>
</head>
<body>
  <div class="card">
    <div class="glyph">👗</div>
    <h1>אין חיבור לאינטרנט</h1>
    <p>נראה שאתה במצב לא מקוון. בדוק את החיבור ונסה שוב — הארון הדיגיטלי שלך ימתין כאן.</p>
    <button onclick="location.reload()">נסה שוב</button>
  </div>
</body>
</html>
