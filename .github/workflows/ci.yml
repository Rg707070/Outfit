name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Lint is report-only for now: the existing codebase has pre-existing
      # violations (e.g. the established `useEffect(() => load(), [])` pattern).
      # Tighten to a gating step once those are cleaned up.
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
      - run: npm run build
        env:
          # Dummy public values so `next build` can resolve the Supabase client.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
